# Caller for the shared public-readiness scan.
# Hub: https://memsql.atlassian.net/wiki/spaces/~712020c7e5bed2d4d44a6b901975e841e7f735/pages/4436033543
# Guide: https://memsql.atlassian.net/wiki/spaces/~712020c7e5bed2d4d44a6b901975e841e7f735/pages/4435542023
on:
  pull_request:
    paths: ['.github/public-release-request.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  readiness:
    uses: singlestore/securitytesting/.github/workflows/public-readiness.yml@main
    with:
      # Match the org Security-Scans.yml allowlist so common permissive
      # Go licenses (BSD, ISC) are not reported as violations.
      allowed_licenses: HPND,NCSA,0BSD,BSD-3-Clause,BSD-2-Clause,Python-2.0,Apache-2.0,MIT,ISC,Unlicense,CC0-1.0,WTFPL,BlueOak-1.0.0,Zlib,UNKNOWN
    secrets: inherit
