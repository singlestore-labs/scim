name: keyv-worm-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyv-worm-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Scan for keyv / Shai-Hulud Aug 2026 worm
        uses: singlestore/securitytesting/.github/actions/keyv-worm-scan@7511298eff6c4cd09002db9267c323cc5689d7f3
        with:
          fail-on-findings: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: keyv-worm-scan-report
          path: keyv-worm-scan-report.json
