name: keyv-worm-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  keyv-worm-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan for keyv / Shai-Hulud Aug 2026 worm
        uses: singlestore/securitytesting/.github/actions/keyv-worm-scan@main
        with:
          fail-on-findings: "true"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyv-worm-scan-report
          path: keyv-worm-scan-report.json
